openapi: 3.0.3
info:
  title: OXM Benchmark API
  version: 0.0.1
  description: API for sending requests to OXM-benchmark benchmark suite.
  contact:
    email: TBD@email.eu
  license:
    name: "TBD"
    url: "https://example.com/license"
  termsOfService: "https://example.com/terms"

tags:
  - name: Initial config
    description: Operations needed before the initial benchmark creation.
  - name: Benchmark config
    description: Detailed configuration of benchmark.
  - name: Run benchmark
    description: Operations for running and analyzing benchmark runs.

security:
  - BearerAuth: [ ]

paths:
  /datasets:
    get:
      tags: [ Initial config ]
      operationId: getDatasets
      summary: Get all available datasets
      description: Get all available datasets.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetArray"
        '400':
          description: Bad request.

  /datasets/{datasetId}/queries:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [ Initial config ]
      operationId: getQueries
      summary: Get all query sets prepared in the app for given dataset
      description: There will probably be only one query set per dataset in our implementation.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryInfoArray"
        '400':
          description: Bad request.

  /benchmarks:
    post:
      tags: [ Initial config ]
      operationId: postBenchmark
      summary: Create new benchmark
      description: Create new benchmark.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBenchmarkCommand"
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewBenchmarkInfo"
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
    get:
      tags: [ Benchmark config ]
      operationId: getBenchmark
      summary: Get info about given benchmark
      description: Get info about given benchmark with analyzation step results.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Benchmark"
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/tables/{tableId}:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
      - $ref: "#/components/parameters/TableId"
    get:
      tags: [ Benchmark config ]
      operationId: getTable
      summary: Get table detail
      description: Get benchmark's specific table (of a dataset) based on ID.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        '400':
          description: Bad request.
    put:
      tags: [ Benchmark config ]
      operationId: updateTableSize
      summary: Update table size
      description: Update table entities count.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTableSizeCommand"
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/queries/{queryId}:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
      - $ref: "#/components/parameters/QueryId"
    get:
      tags: [ Benchmark config ]
      operationId: getQuery
      summary: Get query detail
      description: Get dataset's query operation based on ID.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryDetail"
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
      - $ref: "#/components/parameters/BenchmarkOperationId"
    get:
      tags: [ Benchmark config ]
      operationId: getOperations
      summary: Get operation detail
      description: Get benchmark's specific operation based on ID.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkOperation"
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/operations/exact-value/{operationId}:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
      - $ref: "#/components/parameters/BenchmarkOperationId"
    put:
      tags: [ Benchmark config ]
      operationId: updateOperation
      summary: Update exact value operation
      description: Update exact value operation's value(s).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOperationExactValueCommand"
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/columns/{columnId}:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
      - $ref: "#/components/parameters/ColumnId"
    get:
      tags: [ Benchmark config ]
      operationId: getColumn
      summary: Get column detail
      description: Get benchmarks's specific column (of a dataset) based on ID.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableColumn"
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/columns/{columnId}/values:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
      - $ref: "#/components/parameters/ColumnId"
    put:
      tags: [ Benchmark config ]
      operationId: updateColumnValues
      summary: Update column values
      description: Update column values distribution, indexing, count and other statistic.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTableColumnValuesCommand"
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/columns/{columnId}/relationships:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
      - $ref: "#/components/parameters/ColumnId"
    put:
      tags: [ Benchmark config ]
      operationId: updateColumnRelationships
      summary: Update column relationships
      description: Update column relationships distribution and other statistic.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTableColumnRelationshipsCommand"
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/columns/unused/{columnId}:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
      - $ref: "#/components/parameters/ColumnId"
    patch:
      tags: [ Benchmark config ]
      operationId: changeUnusedColumnVisibility
      summary: Change unused column visibility
      description: Remove or add column to/from unused in any query from benchmark execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchColumnVisibilityCommand"
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/runs:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
    post:
      tags: [ Run benchmark ]
      operationId: postBenchmarkRun
      summary: Run the chosen queries on defined dataset
      description: Run the chosen queries on defined dataset.
      responses:
        '200':
          description: Successfully started run.
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/results:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
    get:
      tags: [ Run benchmark ]
      operationId: getBenchmarkResults
      summary: Get list of results of given benchmark
      description: Get list of results of given benchmark.
      responses:
        '200':
          description: Successfully returned list of results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultArray"
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/results/{resultId}:
    parameters:
      - $ref: "#/components/parameters/BenchmarkId"
      - $ref: "#/components/parameters/ResultId"
    get:
      tags: [ Run benchmark ]
      operationId: getBenchmarkResult
      summary: Get detail result of given run of given benchmark
      description: Get detail result of given run of given benchmark.
      responses:
        '200':
          description: Return full results of a given finished run of given benchmark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        '400':
          description: Bad request.

components:
  schemas:

    UpdateTableSizeCommand:
      description: Command for updating number of entities in given table.
      type: object
      properties:
        size:
          type: integer

    UpdateTableColumnValuesCommand:
      description: Command for updating statistics for values in given column.
      type: object
      properties:
        numberOfUniqueValues:
          type: integer
        indexed:
          type: boolean
        uniqueValues:
          type: boolean
        valueDistribution:
          $ref: "#/components/schemas/ValueDistribution"
        distribution:
          type: string
          enum: [ normal, exponential, uniform ]

    UpdateTableColumnRelationshipsCommand:
      description: Command for updating statistics for relationships in given column.
      type: object
      properties:
        valueDistribution:
          $ref: "#/components/schemas/ValueDistribution"
        distribution:
          type: string
          enum: [ normal, exponential, logarithmic, uniform ]

    UpdateOperationExactValueCommand:
      description: Data used to update exact value operation's value(s).
      oneOf:
        - type: object
          required:
            - value
          properties:
            value:
              oneOf:
                - type: string
                - type: integer
                - type: number
                - type: boolean
        - type: object
          required:
            - value1
            - value2
          properties:
            value1:
              oneOf:
                - type: string
                - type: integer
                - type: number
                - type: boolean
            value2:
              oneOf:
                - type: string
                - type: integer
                - type: number
                - type: boolean

    PatchColumnVisibilityCommand:
      description: Command with info for unused column to be change to in/visible to generator.
      type: object
      required:
        - hide
      properties:
        hide:
          type: boolean

    DatasetArray:
      description: Array of dataset information.
      type: array
      items:
        $ref: "#/components/schemas/DatasetInfo"

    DatasetInfo:
      description: Dataset information.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    DatasetDetail:
      description: Detail dataset info with analyzation step results.
      type: object
      allOf:
        - $ref: "#/components/schemas/DatasetInfo"
        - type: object
          properties:
            tables:
              $ref: "#/components/schemas/TableInfoArray"

    TableInfoArray:
      description: Array of basic info about Tables.
      type: array
      items:
        $ref: "#/components/schemas/TableBase"

    TableBase:
      description: Specific Table fields.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        number_of_rows:
          type: number

    Table:
      description: Info about given table in Dataset.
      type: object
      allOf:
        - $ref: "#/components/schemas/TableBase"
        - type: object
          properties:
            columns:
              description: All columns present in the table.
              type: array
              items:
                $ref: "#/components/schemas/TableColumnBase"

    TableColumnBase:
      description: Specific fields of table.
      type: object
      required:
        - id
        - tableId
        - name
        - type
        - unused
      properties:
        id:
          type: string
        tableId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ string, integer, float, date, boolean ]
      oneOf:
        - properties:
            unused:
              type: boolean
              enum: [ false ]
        - required:
            - hidden
          properties:
            unused:
              type: boolean
              enum: [ true ]
            hidden:
              type: boolean
      example:
        id: EXAMPLE_COLUMN_ID
        tableId: EXAMPLE_TABLE_ID
        name: EXAMPLE_COLUMN_NAME
        type: string
        unused: true
        hidden: false

    TableColumn:
      description: Info about a column in given table.
      type: object
      allOf:
        - $ref: "#/components/schemas/TableColumnBase"
        - type: object
          required:
            - operations
            - info
          properties:
            operations:
              $ref: "#/components/schemas/NodeOperationArray"
            valuesInfo:
              $ref: "#/components/schemas/TableColumnValuesInfo"
            relationshipsInfo:
              $ref: "#/components/schemas/TableColumnRelationshipsInfo"

    TableColumnValuesInfo:
      description: Detail info about values present in given column.
      type: object
      required:
        - numberOfValues
        - numberOfUniqueValues
        - indexed
        - uniqueValues
        - valueDistribution
      properties:
        numberOfValues:
          type: integer
        numberOfUniqueValues:
          type: integer
        indexed:
          type: boolean
        uniqueValues:
          type: boolean
        closeToUnique:
          description: Needs to be discussed if needed or useful and it's definition.
          type: boolean
        valueDistribution:
          $ref: "#/components/schemas/ValueDistribution"
        percentiles:
          $ref: "#/components/schemas/Percentiles"
      example:
        numberOfValues: 5000
        numberOfUniqueValues: 5000
        indexed: false
        uniqueValues: true
        percentiles: [ 0, 500, 1000, 1500, 2000, 2500, 3500, 5000, 8000, 20000, 50000 ]

    TableColumnRelationshipsInfo:
      description: Detail info about connections (relationships) present for given column.
      type: object
      properties:
        foreignColumnId:
          type: string
          format: uuid
        numberOfForeignValues:
          type: integer
        relationshipType:
          description: Types one-to-one and many-to-one don't need distributions at all.
          type: string
          enum: [ one-to-one, one-to-many, many-to-one, many-to-many ]
        valueDistribution:
          $ref: "#/components/schemas/ValueDistribution"
        percentiles:
          $ref: "#/components/schemas/Percentiles"

    ValueDistribution:
      description: Distribution of values count in percentiles or dictionary distribution based on number of unique values.
      type: array
      items:
        type: object
        properties:
          value:
            oneOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
          count:
            type: integer

    Percentiles:
      type: array
      description: Values at each 10th percentile of the column's distribution. This includes min, median and max by design (0th, 5th and 10th value).
      items:
        oneOf:
          - type: string
          - type: integer
          - type: number

    OperationBase:
      description: Common properties for all Operations.
      type: object
      required:
        - id
        - name
        - resultsCount
      properties:
        id:
          type: string
        name:
          type: string
        resultsCount:
          type: integer

    NodeOperationArray:
      description: Array of all node operations for given column.
      type: array
      items:
        type: object
        allOf:
          - $ref: "#/components/schemas/OperationBase"
          - $ref: "#/components/schemas/NodeOperation"

    BenchmarkOperation:
      description: Info about an operation executed in a query over some column(s).
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - oneOf:
            - $ref: "#/components/schemas/NestedOperation"
            - $ref: "#/components/schemas/NodeOperation"
      example:
        id: EXAMPLE_OPERATION_ID
        name: EXAMPLE_OPERATION
        resultsCount: 1234
        type: MATCH
        value: 42
        column:
          id: EXAMPLE_COLUMN_ID
          tableId: EXAMPLE_TABLE_ID
          type: integer
          name: MATCH_INT

    BinaryNestedOperation:
      description: Nested operation combining two operations.
      type: object
      required:
        - operation1
        - operation2
        - type
      properties:
        operation1:
          $ref: "#/components/schemas/BenchmarkOperation"
        operation2:
          $ref: "#/components/schemas/BenchmarkOperation"
        type:
          type: string
          enum: [ AND, OR ]

    UnaryNestedOperation:
      description: Nested operation using one additional operation.
      type: object
      required:
        - operation
        - type
      properties:
        operation:
          $ref: "#/components/schemas/BenchmarkOperation"
        type:
          type: string
          enum: [ NOT ]

    NestedOperation:
      description: Operation including nested operations.
      type: object
      oneOf:
        - $ref: "#/components/schemas/BinaryNestedOperation"
        - $ref: "#/components/schemas/UnaryNestedOperation"
      discriminator:
        propertyName: type

    NodeOperation:
      description: Operation not including nested operations.
      type: object
      oneOf:
        - $ref: "#/components/schemas/GeneralValueNodeOperation"
        - $ref: "#/components/schemas/ExactValueNodeOperation"

    ExactValueNodeOperation:
      description: Operation needing exact value in query.
      oneOf:
        - $ref: "#/components/schemas/ExactValueSingleValueOperation"
        - $ref: "#/components/schemas/ExactValueDoubleValueOperation"

    ExactValueSingleValueOperation:
      description: Operation with one exact value needed in query.
      type: object
      required:
        - value
        - column
        - type
      properties:
        value:
          type: string
        column:
          $ref: "#/components/schemas/TableColumnBase"
        type:
          type: string
          enum: [ MATCH, LESS_THAN, MORE_THAN ]

    ExactValueDoubleValueOperation:
      description: Operation with two exact values needed in query.
      type: object
      required:
        - value1
        - value2
        - column
        - type
      properties:
        value1:
          type: string
        value2:
          type: string
        column:
          $ref: "#/components/schemas/TableColumnBase"
        type:
          type: string
          enum: [ RANGE ]

    GeneralValueNodeOperation:
      description: Operation not needing exact value in query.
      oneOf:
        - $ref: "#/components/schemas/GeneralValueSingleColOperation"
        - $ref: "#/components/schemas/GeneralValueDoubleColOperation"

    GeneralValueSingleColOperation:
      description: Operation not needing exact value in query over one column.
      type: object
      required:
        - column
        - type
      properties:
        column:
          $ref: "#/components/schemas/TableColumnBase"
        type:
          type: string
          enum: [ SORT, COUNT, EXTREME ]

    GeneralValueDoubleColOperation:
      description: Operation not needing exact value in query over two columns.
      type: object
      required:
        - column1
        - column2
        - type
      properties:
        column1:
          $ref: "#/components/schemas/TableColumnBase"
        column2:
          $ref: "#/components/schemas/TableColumnBase"
        type:
          type: string
          enum: [ JOIN ]

    QueryInfoArray:
      description: Array of Query information.
      type: array
      items:
        $ref: "#/components/schemas/QueryInfo"

    QueryBase:
      description: Basic Query specific fields.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    QueryInfo:
      description: Brief Query information.
      type: object
      allOf:
        - $ref: "#/components/schemas/QueryBase"

    QueryDetail:
      description: Detailed Query information.
      type: object
      allOf:
        - $ref: "#/components/schemas/QueryBase"
        - type: object
          required:
            - operations
          properties:
            operations:
              $ref: "#/components/schemas/BenchmarkOperation"

    CreateBenchmarkCommand:
      type: object
      description: Info about a new benchmark to be created.
      required:
        - name
        - datasetId
        - querySetId
      properties:
        name:
          type: string
        datasetId:
          type: string
        querySetId:
          type: string

    NewBenchmarkInfo:
      type: object
      description: Info about the newly created benchmark.
      properties:
        benchmarkId:
          type: string
          description: ID of the newly created benchmark.

    Benchmark:
      type: object
      description: Info about analyzed benchmark in app.
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: ID of the requested benchmark.
        name:
          type: string
        queries:
          $ref: "#/components/schemas/QueryInfoArray"
        dataset:
          $ref: "#/components/schemas/DatasetDetail"

    ResultArray:
      description: Array of all Results info for given benchmark.
      type: array
      items:
        $ref: "#/components/schemas/ResultsInfo"

    ResultsInfo:
      description: Basic info about given run result.
      type: object
      required:
        - id
        - name
        - startedAt
        - finished
      properties:
        id:
          type: string
        name:
          type: string
        startedAt:
          type: string
          format: date-time
        finished:
          type: boolean

    QueryResultArray:
      description: Array of results of given query.
      type: array
      items:
        $ref: "#/components/schemas/QueryResult"

    QueryResult:
      description: Result of one given query.
      type: object
      required:
        - id
        - name
        - query
        - times
      properties:
        id:
          type: string
        name:
          type: string
        databaseName:
          type: string
        query:
          $ref: "#/components/schemas/QueryInfo"
        error:
          type: string
        times:
          type: array
          items:
            type: number
            format: float

    Result:
      description: Detailed info about run results.
      required:
        - results
      allOf:
        - $ref: "#/components/schemas/ResultsInfo"
        - type: object
          properties:
            results:
              $ref: "#/components/schemas/QueryResultArray"

  parameters:
    DatasetId:
      in: path
      name: datasetId
      description: ID of required dataset in URL.
      required: true
      schema:
        type: string
        format: uuid
    BenchmarkId:
      in: path
      name: benchmarkId
      description: ID of required benchmark in URL.
      required: true
      schema:
        type: string
        format: uuid
    QueryId:
      in: path
      name: queryId
      description: ID of required query in URL.
      required: true
      schema:
        type: string
        format: uuid
    TableId:
      in: path
      name: tableId
      description: ID of required table in URL.
      required: true
      schema:
        type: string
        format: uuid
    BenchmarkOperationId:
      in: path
      name: operationId
      description: ID of required operation in URL.
      required: true
      schema:
        type: string
        format: uuid
    ColumnId:
      in: path
      name: columnId
      description: ID of required column in existing table in URL.
      required: true
      schema:
        type: string
        format: uuid
    ResultId:
      in: path
      name: resultId
      description: ID of required benchmark result in URL.
      required: true
      schema:
        type: string
        format: uuid
