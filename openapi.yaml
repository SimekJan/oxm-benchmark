openapi: 3.0.3
info:
  title: OXM Benchmark API
  version: 0.0.1
  description: API for sending requests to OXM-benchmark benchmark suite.
  contact:
    email: TBD@email.eu
  license:
    name: "TBD"
    url: "https://example.com/license"
  termsOfService: "https://example.com/terms"

tags:
  - name: Initial config
    description: Operations needed before the initial benchmark creation.
  - name: Benchmark config
    description: Detailed configuration of benchmark.
  - name: Run benchmark
    description: Operations for running and analyzing benchmark runs.

security:
  - BearerAuth: [ ]

paths:
  /datasets:
    get:
      tags: [ Initial config ]
      operationId: getDatasets
      summary: Get all available datasets
      description: Get all available datasets.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetArray"
        '400':
          description: Bad request.

  /datasets/{datasetId}/queries:
    get:
      tags: [ Initial config ]
      operationId: getQueries
      summary: Get all query sets prepared in the app for given dataset
      description: There will probably be only one query set per dataset in our implementation.
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueriesArray"
        '400':
          description: Bad request.

  /benchmarks:
    post:
      tags: [ Benchmark config ]
      operationId: postBenchmark
      summary: Create new benchmark
      description: Create new benchmark.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBenchmarkCommand"
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkInfo"
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}:
    get:
      tags: [ Benchmark config ]
      operationId: getBenchmark
      summary: Get info about given benchmark
      description: Get info about given benchmark with analyzation step results.
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Benchmark"
        '400':
          description: Bad request.
    
    put:
      tags: [ Benchmark config ]
      operationId: updateBenchmark
      summary: Update benchmark parameters
      description: Update data volumes, cardinalities of relationships and value occurrence in data.
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationsArray"
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/column/{columnId}:
    delete:
      tags: [ Benchmark config ]
      operationId: deleteColumn
      summary: Remove unused column
      description: Remove column unused in any query from benchmark execution.
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
        - $ref: "#/components/parameters/ColumnId"
      responses:
        '204':
          description: Successful response.
        '400':
          description: Bad request.
    post:
      tags: [ Benchmark config ]
      operationId: postColumn
      summary: Re-add unused column
      description: Re-add column unused in any query to benchmark execution.
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
        - $ref: "#/components/parameters/ColumnId"
      responses:
        '204':
          description: Successful response.
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/runs:
    post:
      tags: [ Run benchmark ]
      operationId: postBenchmarkRun
      summary: Run the chosen queries on defined dataset
      description: Run the chosen queries on defined dataset.
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
      responses:
        '200':
          description: Successfully started run.
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/results:
    get:
      tags: [ Run benchmark ]
      operationId: getBenchmarkResults
      summary: Get list of results of given benchmark
      description: Get list of results of given benchmark.
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
      responses:
        '200':
          description: Successfully returned list of results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultsArray"
        '400':
          description: Bad request.

  /benchmarks/{benchmarkId}/results/{resultId}:
    get:
      tags: [ Run benchmark ]
      operationId: getBenchmarkResult
      summary: Get detail result of given run of given benchmark
      description: Get detail result of given run of given benchmark.
      parameters:
        - $ref: "#/components/parameters/BenchmarkId"
        - $ref: "#/components/parameters/ResultId"
      responses:
        '200':
          description: Return full results of a given finished run of given benchmark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        '400':
          description: Bad request.

components:
  schemas:
    DatasetArray:
      description: Array of dataset information.
      type: array
      items:
        $ref: "#/components/schemas/DatasetInfo"

    DatasetInfo:
      description: Dataset information.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    DatasetDetail:
      description: Detail dataset info with analyzation step results.
      type: object
      allOf:
        - $ref: "#/components/schemas/DatasetInfo"
      properties:
        tables:
          $ref: "#/components/schemas/TableArray"

    TableArray:
      description: Array of Tables of given Dataset.
      type: array
      items:
        $ref: "#/components/schemas/Table"

    Table:
      description: Info about given table in Dataset.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        rows:
          type: number
        columns:
          description: All columns present in the table.
          type: array
          items:
            $ref: "#/components/schemas/TableColumn"

    TableColumn:
      description: Info about a table column in given table.
      type: object
      required:
        - tableId
        - name
        - type
      properties:
        tableId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ string, integer, float, date, boolean ]

    OperationBase:
      description: Common properties for all Operations.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string

    OperationsArray:
      description: Array of all operations for given dataset and queries.
      type: array
      items:
        $ref: "#/components/schemas/BenchmarkOperation"

    BenchmarkOperation:
      description: Info about an operation executed in a query over some column(s).
      oneOf:
        - $ref: "#/components/schemas/NestedOperation"
        - $ref: "#/components/schemas/NodeOperation"

    BinaryNestedOperation:
      description: Nested operation combining two operations.
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - $ref: "#/components/schemas/BinaryNestedOperationBase"

    BinaryNestedOperationBase:
      description: Common properties for all Binary operations.
      type: object
      required:
        - operation1
        - operation2
        - type
      properties:
        operation1:
          $ref: "#/components/schemas/BenchmarkOperation"
        operation2:
          $ref: "#/components/schemas/BenchmarkOperation"
        type:
          type: string
          enum: [ AND, OR ]

    UnaryNestedOperation:
      description: Nested operation using one additional operation.
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - $ref: "#/components/schemas/UnaryNestedOperationBase"

    UnaryNestedOperationBase:
      description: Specific properties for Unary operations.
      type: object
      required:
        - operation
        - type
      properties:
        operation:
          $ref: "#/components/schemas/BenchmarkOperation"
        type:
          type: string
          enum: [ NOT ]

    NestedOperation:
      description: Operation including nested operations.
      type: object
      oneOf:
        - $ref: "#/components/schemas/BinaryNestedOperation"
        - $ref: "#/components/schemas/UnaryNestedOperation"

    NodeOperation:
      description: Operation not including nested operations.
      type: object
      oneOf:
        - $ref: "#/components/schemas/GeneralValueNodeOperation"
        - $ref: "#/components/schemas/ExactValueNodeOperation"

    ExactValueNodeOperation:
      description: Operation needing exact value in query.
      oneOf:
        - $ref: "#/components/schemas/ExactValueSingleValueOperation"
        - $ref: "#/components/schemas/ExactValueDoubleValueOperation"

    ExactValueSingleValueOperation:
      description: Operation with one exact value needed in query.
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - $ref: "#/components/schemas/ExactValueSingleValueOperationBase"

    ExactValueSingleValueOperationBase:
      description: Specific properties for Exact value single value operation.
      type: object
      required:
        - value
        - column
        - type
      properties:
        value:
          type: string
        column:
          $ref: "#/components/schemas/TableColumn"
        type:
          type: string
          enum: [ MATCH, LESS_THAN, MORE_THAN ]

    ExactValueDoubleValueOperation:
      description: Operation with two exact values needed in query.
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - $ref: "#/components/schemas/ExactValueDoubleValueOperationBase"

    ExactValueDoubleValueOperationBase:
      description: Specific properties for Exact value double value operation.
      type: object
      required:
        - value1
        - value2
        - column
        - type
      properties:
        value1:
          type: string
        value2:
          type: string
        column:
          $ref: "#/components/schemas/TableColumn"
        type:
          type: string
          enum: [ RANGE ]

    GeneralValueNodeOperation:
      description: Operation not needing exact value in query.
      oneOf:
        - $ref: "#/components/schemas/GeneralValueSingleColOperation"
        - $ref: "#/components/schemas/GeneralValueDoubleColOperation"

    GeneralValueSingleColOperation:
      description: Operation not needing exact value in query over one column.
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - $ref: "#/components/schemas/GeneralValueSingleColOperationBase"

    GeneralValueSingleColOperationBase:
      description: Specific properties for General value single column operations.
      type: object
      required:
        - column
        - type
      properties:
        column:
          $ref: "#/components/schemas/TableColumn"
        type:
          type: string
          enum: [ SORT, COUNT, MAX ]

    GeneralValueDoubleColOperation:
      description: Operation not needing exact value in query over two columns.
      allOf:
        - $ref: "#/components/schemas/OperationBase"
        - $ref: "#/components/schemas/GeneralValueDoubleColOperationBase"

    GeneralValueDoubleColOperationBase:
      description: Specific properties for General value double column operations.
      type: object
      required:
        - column1
        - column2
        - type
      properties:
        column1:
          $ref: "#/components/schemas/TableColumn"
        column2:
          $ref: "#/components/schemas/TableColumn"
        type:
          type: string
          enum: [ JOIN ]

    QueriesArray:
      description: Array of Query-sets information.
      type: array
      items:
        $ref: "#/components/schemas/Query"

    Query:
      description: Query-sets information.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    CreateBenchmarkCommand:
      type: object
      description: Info about a new benchmark to be created.
      required:
        - name
        - datasetId
        - querySetId
      properties:
        name:
          type: string
        datasetId:
          type: string
        querySetId:
          type: string

    BenchmarkInfo:
      type: object
      description: Info about the newly created benchmark.
      properties:
        benchmarkId:
          type: string
          description: ID of the newly created benchmark.

    Benchmark:
      type: object
      description: Info about analyzed benchmark in app.
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: ID of the requested benchmark.
        name:
          type: string
        queries:
          $ref: "#/components/schemas/QueriesArray"
        dataset:
          $ref: "#/components/schemas/DatasetDetail"
        operations:
          $ref: "#/components/schemas/OperationsArray"

    ResultsArray:
      description: Array of all Results info for given benchmark.
      type: array
      items:
        $ref: "#/components/schemas/ResultsInfo"

    ResultsInfo:
      description: Basic info about given run result.
      type: object
      required:
        - id
        - name
        - startedAt
        - finished
      properties:
        id:
          type: string
        name:
          type: string
        startedAt:
          type: string
          format: date-time
        finished:
          type: boolean

    QueryResultsArray:
      description: Array of results of given query.
      type: array
      items:
        $ref: "#/components/schemas/QueryResult"

    QueryResult:
      description: Result of one given query.
      type: object
      required:
        - id
        - name
        - query
        - times
      properties:
        id:
          type: string
        name:
          type: string
        databaseName:
          type: string
        query:
          $ref: "#/components/schemas/Query"
        error:
          type: string
        times:
          type: array
          items:
            type: number
            format: float

    Result:
      description: Detailed info about run results.
      required:
        - results
      allOf:
        - $ref: "#/components/schemas/ResultsInfo"
        - type: object
          properties:
            results:
              $ref: "#/components/schemas/QueryResultsArray"

  parameters:
    DatasetId:
      in: path
      name: datasetId
      description: ID of required dataset in URL.
      required: true
      schema:
        type: string
    BenchmarkId:
      in: path
      name: benchmarkId
      description: ID of required benchmark in URL.
      required: true
      schema:
        type: string
    ColumnId:
      in: path
      name: columnId
      description: ID of required column in existing table in URL.
      required: true
      schema:
        type: string
    ResultId:
      in: path
      name: resultId
      description: ID of required benchmark result in URL.
      required: true
      schema:
        type: string
