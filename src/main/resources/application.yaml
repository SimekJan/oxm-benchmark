spring:
  datasource:
    url: jdbc:sqlite:./data/app.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on&synchronous=FULL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update